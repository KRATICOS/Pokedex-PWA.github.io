
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <meta name="description" content="Explora la Pokédex, descubre Pokémon y consulta sus características.">
    <meta name="theme-color" content="#dc0a2d">

    <!-- Estilos -->
    <link rel="stylesheet" href="./CSS/style.css">

    <!-- Manifest de la PWA -->
    <link rel="manifest" href="./manifest.json">

    <!-- Icono para dispositivos Apple -->
    <link rel="apple-touch-icon" href="./images/icons/icon-192x192.png">

    <!-- Configuración para dispositivos Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Pokédex PWA</title>
</head>

<body>

    <main>

        <nav>
            <h1>Pokédex PWA</h1>

            <ul>
                <li> Home  </li>
                <li> About </li>
                <li> Blog </li>
            </ul>
        </nav>

        <!-- Catálogo de Pokémon -->
        <div class="container"></div>

    </main>

    <!-- JavaScript de la aplicación -->
    <script src="./js/app.js"></script>

    <!-- Registro del Service Worker -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", async () => {
                try {
                    const registro = await navigator.serviceWorker.register(
                        "./serviceworker.js"
                    );

                    console.log(
                        "Service Worker registrado correctamente:",
                        registro.scope
                    );

                    await registro.update();
                } catch (error) {
                    console.error(
                        "Error al registrar el Service Worker:",
                        error
                    );
                }
            });
        }
    </script>

</body>

</html>
