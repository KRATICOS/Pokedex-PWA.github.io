<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <meta
      name="description"
      content="Explora la Pokédex, descubre Pokémon y consulta sus características."
    />
    <meta name="theme-color" content="#dc0a2d" />

    <!-- Estilos -->
    <link rel="stylesheet" href="./CSS/style.css" />

    <!-- Manifest de la PWA -->
    <link rel="manifest" href="./manifest.json" />

    <!-- Icono para dispositivos Apple -->
    <link rel="apple-touch-icon" href="./images/icons/icon-192x192.png" />

    <!-- Configuración para dispositivos Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <title>Pokédex PWA</title>
  </head>

  <body>
    <main>
      <nav>
        <h1>Pokédex PWA</h1>

        <div class="buscador-container">
          <input
            type="search"
            id="buscadorPokemon"
            placeholder="Buscar Pokémon por nombre o número..."
            aria-label="Buscar Pokémon por nombre o número"
            autocomplete="off"
          />
          <button id="limpiarBusqueda" type="button">Limpiar</button>
        </div>

        <p id="mensajeBusqueda" aria-live="polite"></p>

        <ul>
          <li>Home</li>
          <li>About</li>
          <li>Blog</li>
        </ul>

        <!-- Botón para instalar la PWA -->
        <button id="btnInstalar" hidden>Instalar aplicación</button>
      </nav>

      <!-- Catálogo de Pokémon -->
      <div class="container"></div>
    </main>

    <!-- JavaScript de la aplicación -->
    <script src="./js/app.js"></script>

    <!-- Funcionalidad del botón de instalación -->

    <!-- Funcionalidad del botón de instalación -->
    <script>
      let eventoInstalacion = null;

      const btnInstalar = document.getElementById("btnInstalar");

      // Comprobar si la aplicación ya está instalada
      const esAplicacionInstalada =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;

      if (esAplicacionInstalada) {
        btnInstalar.hidden = true;
      } else {
        // Mostrar el botón desde el principio
        btnInstalar.hidden = false;
      }

      // Detectar cuándo el navegador permite instalar la PWA
      window.addEventListener("beforeinstallprompt", (evento) => {
        evento.preventDefault();

        eventoInstalacion = evento;
        btnInstalar.hidden = false;

        console.log("La PWA está disponible para instalar.");
      });

      // Acción del botón
      btnInstalar.addEventListener("click", async () => {
        if (!eventoInstalacion) {
          alert(
            "El navegador todavía no ofrece la instalación automática. " +
              "En Chrome, abre el menú y busca 'Instalar Pokédex PWA' " +
              "o 'Instalar aplicación'."
          );

          console.log("No se ha recibido el evento beforeinstallprompt.");

          return;
        }

        eventoInstalacion.prompt();

        const resultado = await eventoInstalacion.userChoice;

        console.log("Resultado:", resultado.outcome);

        eventoInstalacion = null;
      });

      // Ocultar el botón después de instalar
      window.addEventListener("appinstalled", () => {
        btnInstalar.hidden = true;
        eventoInstalacion = null;

        console.log("Pokédex PWA instalada correctamente.");
      });
    </script>

    <!-- Registro del Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            const registro = await navigator.serviceWorker.register(
              "./serviceworker.js"
            );

            console.log(
              "Service Worker registrado correctamente:",
              registro.scope
            );

            await registro.update();
          } catch (error) {
            console.error("Error al registrar el Service Worker:", error);
          }
        });
      }
    </script>
  </body>
</html>
